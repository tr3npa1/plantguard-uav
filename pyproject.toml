[build-system]
requires = ["setuptools>=80,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "plantguard-uav"
version = "0.1.0"
description = "Local-first autonomous UAV crop-monitoring and plant-health inspection system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "PlantGuard UAV contributors" },
]
keywords = [
  "agriculture",
  "computer-vision",
  "machine-learning",
  "mavsdk",
  "px4",
  "uav",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.15,<2",
  "fastapi>=0.140.13,<0.141",
  "pydantic>=2.13.4,<2.14",
  "pydantic-settings[yaml]>=2.14.2,<2.15",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "structlog>=26.1,<27",
  "uvicorn>=0.52,<0.53",
]

[project.scripts]
plantguard-uav = "plantguard_uav.__main__:main"

[project.optional-dependencies]
geospatial = [
  "geojson>=3.1,<4",
  "pyproj>=3.6,<4",
  "shapely>=2.0,<3",
]

flight = [
  "mavsdk>=3.17.2,<3.18",
]

vision = [
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
]

test = [
  "hypothesis>=6.120,<7",
  "httpx2>=2.9,<3",
  "pytest>=9.1.1,<9.2",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "pytest-mock>=3.14,<4",
]

dev = [
  "build>=1.2,<2",
  "mypy>=2.3,<2.4",
  "pre-commit>=4.2,<5",
  "ruff>=0.15.22,<0.16",
  "twine>=6.1,<7",
  "types-PyYAML>=6.0.12,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["plantguard_uav*"]
exclude = [
  "plantguard_uav.tests*",
]

[tool.setuptools.package-data]
plantguard_uav = [
  "configs/*.yaml",
  "py.typed",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "artifacts",
  "data/processed",
  "data/raw",
  "models",
  "results",
]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "D",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "I",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "TID",
  "UP",
  "W",
]
ignore = [
  "D100",
  "D104",
  "D105",
  "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
  "plantguard_uav",
]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[tool.mypy]
python_version = "3.12"
files = [
  "src/plantguard_uav",
  "tests",
]
mypy_path = "src"
exclude = [
  "^artifacts/",
  "^data/processed/",
  "^data/raw/",
  "^models/",
  "^results/",
]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "geojson.*",
  "mavsdk.*",
  "onnx.*",
  "onnxruntime.*",
  "pyproj.*",
  "shapely.*",
  "torch.*",
  "ultralytics.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--showlocals",
  "--strict-config",
  "--strict-markers",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "contract: component-interface and schema-contract tests",
  "integration: tests crossing component or process boundaries",
  "simulation: tests requiring PX4 SITL, Gazebo, or simulated hardware",
  "slow: tests unsuitable for the default fast test run",
]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = [
  "plantguard_uav",
]
omit = [
  "*/__init__.py",
  "tests/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
sort = "Cover"
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "artifacts/coverage/html"

[tool.coverage.xml]
output = "artifacts/coverage/coverage.xml"
